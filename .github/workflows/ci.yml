name: Build and lint code

on:
  pull_request:
    types: [ opened, reopened, ready_for_review, labeled, synchronize ]
  push:
    branches: [ master ]
  merge_group:

# cancel stale runs when a newer run for the same PR/branch is queued,
# so pushes don't pile up
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    # runs on PRs labelled `ready`, and on non-draft PRs from crux-bphc
    # members/collaborators without the label. labelling something other than
    # `ready` doesn't re-run it
    if: >-
      ${{ github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && github.event.label.name == 'ready')
      || (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'ready')
        || (!github.event.pull_request.draft && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)))) }}
    # GitHub-hosted: free for this public repo, and every job gets its own
    # VM, which eliminates the serial queue on the single self-hosted runner
    # (deploys stay self-hosted in pipeline.yml/release.yml)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # any node 24 is already in the runner's tool cache, an exact patch
      # version gets downloaded every time
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm i -g pnpm@11.18.0 --no-fund --no-audit

      # node_modules itself rather than the pnpm store: restoring it takes as
      # long, and then there's nothing left to install
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            */node_modules
          key: ci-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install -r --frozen-lockfile

      - name: Build lib
        run: pnpm tsc --build
        working-directory: "./lib"

      - name: Build backend
        run: pnpm tsc --build
        working-directory: "./backend"

      - name: Build frontend
        run: pnpm run build
        working-directory: "./frontend"

      - name: Run biomejs linter and formatter on lib
        run: pnpm biome ci .
        working-directory: "./lib"

      - name: Run biomejs linter and formatter on backend
        run: pnpm biome ci .
        working-directory: "./backend"

      - name: Run biomejs linter and formatter on frontend
        run: pnpm biome ci .
        working-directory: "./frontend"
